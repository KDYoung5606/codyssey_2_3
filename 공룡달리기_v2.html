<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쥬라기 공룡 달리기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #2b1d16 0%, #1c120d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
      color: #f7ebd9;
      padding: 20px;
    }

    .game-wrapper {
      width: 100%;
      max-width: 920px;
      background: #3a271d;
      border: 3px solid #7c5638;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
      padding: 10px 16px;
      background: #281a13;
      border: 2px solid #63432b;
      border-radius: 10px;
    }

    .game-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .game-title h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8d29d;
    }

    .speed-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: #4e3422;
      color: #ffd180;
      border: 1px solid #8a5c38;
    }

    .score-board {
      display: flex;
      align-items: center;
      gap: 20px;
      font-variant-numeric: tabular-nums;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .score-label {
      font-size: 11px;
      font-weight: 700;
      color: #bfa184;
      letter-spacing: 0.5px;
    }

    .score-value {
      font-size: 24px;
      font-weight: 900;
      color: #fff3e0;
      line-height: 1.15;
    }

    .score-value.high {
      color: #ffb74d;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 900 / 400;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #5e3f28;
      background: #e5c594;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(28, 17, 11, 0.62);
      backdrop-filter: blur(2px);
      text-align: center;
      padding: 20px;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-card {
      background: rgba(45, 29, 20, 0.94);
      border: 2px solid #a87648;
      border-radius: 14px;
      padding: 26px 34px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .overlay-card h2 {
      font-size: 26px;
      font-weight: 900;
      color: #ffd180;
      margin-bottom: 10px;
    }

    .overlay-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #ead7c3;
      margin-bottom: 18px;
    }

    .result-summary {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 18px;
      padding: 12px;
      background: #23150e;
      border-radius: 10px;
      border: 1px solid #6b482e;
    }

    .result-item span {
      display: block;
      font-size: 12px;
      color: #bfa184;
      margin-bottom: 4px;
    }

    .result-item strong {
      font-size: 22px;
      font-weight: 900;
      color: #fff3e0;
    }

    .result-item strong.record {
      color: #ffab40;
    }

    .new-record-tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #d84315;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .action-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      padding: 13px 34px;
      font-size: 17px;
      font-weight: 800;
      border-radius: 10px;
      color: #241309;
      background: linear-gradient(180deg, #ffca28 0%, #ff8f00 100%);
      box-shadow: 0 5px 0 #b25900, 0 8px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
    }

    .action-btn:hover {
      filter: brightness(1.06);
    }

    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b25900, 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .controls-guide {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: #d7bfa8;
      padding: 0 4px;
    }

    .key-hint {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    kbd {
      display: inline-block;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      color: #2b1a10;
      background: #f2dec4;
      border: 1px solid #9c7451;
      border-bottom-width: 2px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="top-bar">
      <div class="game-title">
        <h1>쥬라기 공룡 달리기</h1>
        <span class="speed-badge" id="speedBadge">속도 1.00x</span>
      </div>
      <div class="score-board">
        <div class="score-box">
          <span class="score-label">최고 점수</span>
          <span class="score-value high" id="highScoreDisplay">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">현재 점수</span>
          <span class="score-value" id="currentScoreDisplay">0</span>
        </div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="900" height="400"></canvas>

      <!-- 시작 화면 오버레이 -->
      <div class="overlay" id="startOverlay">
        <div class="overlay-card">
          <h2>쥬라기 공룡 달리기</h2>
          <p>
            <kbd>Space</kbd>를 짧게 누르면 낮게, 길게(최대 0.3초) 누르면 높게 점프합니다.<br />
            불꽃 아이템을 획득하면 <strong>3초간 무적</strong> 상태가 되어 장애물을 날려버립니다!
          </p>
          <button type="button" class="action-btn" id="startBtn">게임 시작</button>
        </div>
      </div>

      <!-- 게임 오버 오버레이 -->
      <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-card">
          <div class="new-record-tag hidden" id="newRecordTag">최고 점수 달성!</div>
          <h2>게임 오버</h2>
          <div class="result-summary">
            <div class="result-item">
              <span>최종 점수</span>
              <strong id="finalScoreText">0</strong>
            </div>
            <div class="result-item">
              <span>최고 점수</span>
              <strong class="record" id="finalHighScoreText">0</strong>
            </div>
          </div>
          <button type="button" class="action-btn" id="restartBtn">다시 시작</button>
        </div>
      </div>
    </div>

    <div class="controls-guide">
      <div class="key-hint">
        <span><kbd>Space</kbd> 점프 (누르는 시간 비례 · 최대 0.3초)</span>
        <span><kbd>↓</kbd> 숙이기 / 빠른 착지</span>
      </div>
      <span>불꽃 아이템: 3초 무적 &amp; 장애물 "펑!" 날리기</span>
    </div>
  </div>

  <script>
    (() => {
      // =========================================================
      // 1. 기본 설정 및 상수 정의
      // =========================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const LOGIC_WIDTH = 900;
      const LOGIC_HEIGHT = 400;
      const GROUND_Y = 324; // 지면 기준선 (이 아래 및 공룡/장애물 영역엔 초록색 미사용)

      const STORAGE_KEY = 'jurassic_dino_high_score_v1';

      // 속도 관련 상수: 시작 속도에서 1초마다 조금씩 증가, 최대 정확히 2.0배에서 고정
      const BASE_SPEED = 360;           // px/s (시작 속도)
      const MAX_SPEED_MULT = 2.0;       // 최대 속도 배율 (시작 속도의 2배)
      const SPEED_STEP_PER_SEC = 0.025; // 1초마다 +0.025x (10초 뒤 1.25x, 40초 뒤 2.0x 도달 후 고정)

      // 점프 물리 상수 (최대 0.30초 홀드 반영, 키를 떼면 상승 즉시 억제 후 하강)
      const MAX_JUMP_HOLD_TIME = 0.30;  // 최대 홀드 반영 시간 (초)
      const JUMP_HOLD_VELOCITY = -390;  // 누르고 있는 동안 유지되는 상승 속도 (px/s)
      const JUMP_RELEASE_CAP = -310;    // 키를 떼거나 0.3초 도달 시 상승 속도 제한
      const GRAVITY = 2150;             // 중력 가속도 (px/s^2)
      const FAST_FALL_SPEED = 740;      // 공중에서 ↓ 키 입력 시 빠른 하강 속도

      // 불꽃 아이템 및 무적 상수
      const FLAME_MIN_INTERVAL = 3.0;   // 불꽃 아이템 최소 재등장 간격 (3초)
      const INVINCIBLE_DURATION = 3.0;  // 무적 지속 시간 (3초)

      // =========================================================
      // 2. DOM 요소 및 로컬스토리지 연동
      // =========================================================
      const currentScoreEl = document.getElementById('currentScoreDisplay');
      const highScoreEl = document.getElementById('highScoreDisplay');
      const speedBadgeEl = document.getElementById('speedBadge');
      const startOverlay = document.getElementById('startOverlay');
      const gameOverOverlay = document.getElementById('gameOverOverlay');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const finalScoreText = document.getElementById('finalScoreText');
      const finalHighScoreText = document.getElementById('finalHighScoreText');
      const newRecordTag = document.getElementById('newRecordTag');

      function loadHighScore() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          const parsed = parseInt(saved, 10);
          return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
        } catch (err) {
          return 0;
        }
      }

      function saveHighScore(score) {
        try {
          localStorage.setItem(STORAGE_KEY, String(Math.floor(score)));
        } catch (err) {
          // 로컬스토리지 접근 제한 환경 예외 무시
        }
      }

      // =========================================================
      // 3. 레티나/고해상도 디스플레이 대응 캔버스 스케일링
      // =========================================================
      function setupHiDPICanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = LOGIC_WIDTH * dpr;
        canvas.height = LOGIC_HEIGHT * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      setupHiDPICanvas();
      window.addEventListener('resize', setupHiDPICanvas);

      // =========================================================
      // 4. 게임 상태 변수
      // =========================================================
      let gameState = 'READY'; // 'READY' | 'PLAYING' | 'GAME_OVER'
      let gameOverTimestamp = 0;
      let rawScore = 0;
      let displayScore = 0;
      let highScore = loadHighScore();
      let isNewRecordThisRun = false;

      let speedMultiplier = 1.0;
      let currentSpeed = BASE_SPEED;
      let oneSecondTimer = 0;

      let groundScroll = 0;
      let volcanoScroll = 0;
      let cloudScroll = 0;

      // 입력 상태
      let isSpaceDown = false;
      let isDuckDown = false;

      // 공룡 객체
      const dino = {
        x: 96,
        y: GROUND_Y,
        standWidth: 46,
        standHeight: 56,
        duckWidth: 60,
        duckHeight: 32,
        vy: 0,
        isGrounded: true,
        isHoldingJump: false,
        jumpHoldTimer: 0,
        isDucking: false,
        runCycle: 0,
        invincibleTimer: 0
      };

      // 엔티티 목록
      let obstacles = [];
      let flameItems = [];
      let popEffects = []; // "펑!" 애니메이션 효과
      let particles = [];  // 불꽃/먼지 입자

      // 스폰 제어
      let nextObstacleDistance = 420;
      let timeSinceLastFlame = FLAME_MIN_INTERVAL;

      // 배경 구름 & 연기 데이터
      const clouds = [
        { x: 120, y: 46, scale: 1.0 },
        { x: 410, y: 34, scale: 0.85 },
        { x: 720, y: 54, scale: 1.15 }
      ];

      const smokePuffs = [
        { x: 215, y: 74, r: 9, alpha: 0.45, phase: 0 },
        { x: 222, y: 56, r: 13, alpha: 0.32, phase: 1.4 },
        { x: 668, y: 84, r: 8, alpha: 0.40, phase: 2.5 }
      ];

      // =========================================================
      // 5. 초기화 및 게임 시작/재시작
      // =========================================================
      function updateScoreUI() {
        currentScoreEl.textContent = String(displayScore);
        highScoreEl.textContent = String(highScore);
        speedBadgeEl.textContent = `속도 ${speedMultiplier.toFixed(2)}x`;
      }

      function resetGame() {
        rawScore = 0;
        displayScore = 0;
        isNewRecordThisRun = false;

        speedMultiplier = 1.0;
        currentSpeed = BASE_SPEED;
        oneSecondTimer = 0;

        dino.y = GROUND_Y;
        dino.vy = 0;
        dino.isGrounded = true;
        dino.isHoldingJump = false;
        dino.jumpHoldTimer = 0;
        dino.isDucking = isDuckDown;
        dino.runCycle = 0;
        dino.invincibleTimer = 0;

        obstacles = [];
        flameItems = [];
        popEffects = [];
        particles = [];

        nextObstacleDistance = 380;
        timeSinceLastFlame = FLAME_MIN_INTERVAL;

        newRecordTag.classList.add('hidden');
        updateScoreUI();
      }

      function startGame() {
        resetGame();
        gameState = 'PLAYING';
        startOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
      }

      function triggerGameOver() {
        gameState = 'GAME_OVER';
        gameOverTimestamp = performance.now();
        dino.isHoldingJump = false;
        saveHighScore(highScore);

        finalScoreText.textContent = String(displayScore);
        finalHighScoreText.textContent = String(highScore);
        if (isNewRecordThisRun && displayScore > 0) {
          newRecordTag.classList.remove('hidden');
        } else {
          newRecordTag.classList.add('hidden');
        }

        gameOverOverlay.classList.remove('hidden');
      }

      startBtn.addEventListener('click', (e) => {
        e.currentTarget.blur();
        startGame();
      });

      restartBtn.addEventListener('click', (e) => {
        e.currentTarget.blur();
        startGame();
      });

      updateScoreUI();

      // =========================================================
      // 6. 키보드 입력 처리 (PC 스페이스바 점프 & ↓ 숙이기)
      // =========================================================
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'ArrowUp') {
          e.preventDefault();
        }

        if (e.code === 'Space') {
          if (e.repeat) return;
          isSpaceDown = true;

          if (gameState === 'PLAYING') {
            // 공중에서는 다시 점프하지 않음 (땅에 있을 때만 점프 시작)
            if (dino.isGrounded) {
              dino.isGrounded = false;
              dino.isDucking = false;
              dino.isHoldingJump = true;
              dino.jumpHoldTimer = 0;
              dino.vy = JUMP_HOLD_VELOCITY;
              spawnDustParticles(dino.x + 18, GROUND_Y, 6);
            }
          } else if (gameState === 'READY') {
            startGame();
          } else if (gameState === 'GAME_OVER' && performance.now() - gameOverTimestamp > 350) {
            startGame();
          }
        }

        if (e.code === 'ArrowDown') {
          isDuckDown = true;
          if (gameState === 'PLAYING') {
            if (dino.isGrounded) {
              dino.isDucking = true;
            } else {
              // 공중에서 ↓ 누르면 상승 중단 및 빠른 착지
              dino.isHoldingJump = false;
              if (dino.vy < FAST_FALL_SPEED) {
                dino.vy = FAST_FALL_SPEED;
              }
            }
          }
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          isSpaceDown = false;
          // 키를 떼면 상승을 멈추고 내려옴
          if (dino.isHoldingJump) {
            dino.isHoldingJump = false;
            if (dino.vy < JUMP_RELEASE_CAP) {
              dino.vy = JUMP_RELEASE_CAP;
            }
          }
        }

        if (e.code === 'ArrowDown') {
          isDuckDown = false;
          dino.isDucking = false;
        }
      });

      window.addEventListener('blur', () => {
        isSpaceDown = false;
        isDuckDown = false;
        dino.isHoldingJump = false;
        dino.isDucking = false;
      });

      // =========================================================
      // 7. 장애물 및 불꽃 아이템 생성 (피할 수 없는 배치 방지)
      // =========================================================
      function spawnObstacle() {
        // 장애물은 배경(모래·황토·회갈색)과 뚜렷하게 구분되는 비-초록색(진한 갈색, 짙은 회색, 붉은 주황) 사용
        const types = [
          {
            kind: 'small_rock',
            width: 34,
            height: 32,
            yOffset: 0,
            isAirborne: false
          },
          {
            kind: 'small_cactus',
            width: 28,
            height: 36,
            yOffset: 0,
            isAirborne: false
          },
          {
            kind: 'large_rock',
            width: 52,
            height: 70,
            yOffset: 0,
            isAirborne: false
          },
          {
            kind: 'large_cactus',
            width: 46,
            height: 74,
            yOffset: 0,
            isAirborne: false
          }
        ];

        // 일정 점수(250점) 이상부터 공중 익룡 장애물 추가
        // (높이를 지면 위 54px로 설정하여 ↓ 숙이기로 통과하거나, 0.3초 긴 점프로 뛰어넘을 수 있음)
        if (displayScore >= 250) {
          types.push({
            kind: 'pteranodon',
            width: 52,
            height: 24,
            yOffset: 54,
            isAirborne: true
          });
        }

        const chosen = types[Math.floor(Math.random() * types.length)];
        obstacles.push({
          x: LOGIC_WIDTH + 30,
          y: GROUND_Y - chosen.yOffset,
          width: chosen.width,
          height: chosen.height,
          kind: chosen.kind,
          isAirborne: chosen.isAirborne,
          wingPhase: Math.random() * Math.PI * 2,
          blasted: false,
          vx: 0,
          vy: 0,
          rotation: 0,
          vRot: 0
        });

        // 한 번 착지한 뒤 다음 장애물을 넘을 수 있는 최소 안전 간격 확보
        // 최대 점프 체공 시간(~0.79s) + 착지 후 다음 점프 준비 시간(~0.36s) 기준
        const minSafeGap = currentSpeed * 1.15 + 140;
        const extraRandomGap = Math.random() * (currentSpeed * 0.65 + 170);
        nextObstacleDistance = minSafeGap + extraRandomGap;
      }

      function trySpawnFlameItem(dt) {
        timeSinceLastFlame += dt;
        // 한 번 나타난 뒤 최소 3초가 지나야 다시 나타날 수 있음
        if (timeSinceLastFlame < FLAME_MIN_INTERVAL) return;
        if (flameItems.length > 0) return;

        // 3초 이후부터 무작위 확률로 등장
        if (Math.random() < 0.48 * dt) {
          const heightOptions = [34, 78];
          const hoverHeight = heightOptions[Math.floor(Math.random() * heightOptions.length)];

          flameItems.push({
            x: LOGIC_WIDTH + 40,
            y: GROUND_Y - hoverHeight,
            radius: 15,
            pulse: 0
          });

          timeSinceLastFlame = 0;
        }
      }

      function spawnDustParticles(x, y, count) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x: x + (Math.random() - 0.5) * 18,
            y: y - 2,
            vx: -60 - Math.random() * 110,
            vy: -20 - Math.random() * 70,
            life: 0.35 + Math.random() * 0.2,
            maxLife: 0.55,
            size: 3 + Math.random() * 3,
            color: i % 2 === 0 ? '#a67c52' : '#7d5a38'
          });
        }
      }

      function spawnBlastEffect(x, y) {
        // "펑" 애니메이션 등록
        popEffects.push({
          x,
          y,
          timer: 0,
          duration: 0.65
        });

        // 불꽃 파편 입자
        const colors = ['#ff3d00', '#ff9100', '#ffd600', '#fff3e0'];
        for (let i = 0; i < 18; i++) {
          const angle = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.3;
          const speed = 140 + Math.random() * 260;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 60,
            life: 0.45 + Math.random() * 0.25,
            maxLife: 0.7,
            size: 4 + Math.random() * 4,
            color: colors[i % colors.length]
          });
        }
      }

      // =========================================================
      // 8. 충돌 판정
      // =========================================================
      function getDinoHitbox() {
        const w = dino.isDucking ? dino.duckWidth : dino.standWidth;
        const h = dino.isDucking ? dino.duckHeight : dino.standHeight;
        return {
          left: dino.x + 7,
          right: dino.x + w - 7,
          top: dino.y - h + 6,
          bottom: dino.y - 3
        };
      }

      function getObstacleHitbox(obs) {
        return {
          left: obs.x + 5,
          right: obs.x + obs.width - 5,
          top: obs.y - obs.height + 5,
          bottom: obs.y - 2
        };
      }

      function isIntersecting(a, b) {
        return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
      }

      // =========================================================
      // 9. 프레임 업데이트 로직
      // =========================================================
      function update(dt) {
        cloudScroll = (cloudScroll + 16 * dt) % (LOGIC_WIDTH + 200);
        for (const puff of smokePuffs) {
          puff.phase += dt * 1.4;
        }

        if (gameState !== 'PLAYING') {
          return;
        }

        // 1) 1초마다 속도 점진적 증가, 시작 속도의 최대 2배에서 고정
        oneSecondTimer += dt;
        while (oneSecondTimer >= 1.0) {
          oneSecondTimer -= 1.0;
          if (speedMultiplier < MAX_SPEED_MULT) {
            speedMultiplier = Math.min(MAX_SPEED_MULT, Number((speedMultiplier + SPEED_STEP_PER_SEC).toFixed(4)));
            currentSpeed = BASE_SPEED * speedMultiplier;
          }
        }

        // 2) 이동 거리와 시간에 따른 점수 상승 및 최고 점수 실시간 갱신
        rawScore += (currentSpeed / BASE_SPEED) * 18 * dt;
        displayScore = Math.floor(rawScore);

        if (displayScore > highScore) {
          highScore = displayScore;
          isNewRecordThisRun = true;
          saveHighScore(highScore);
        }
        updateScoreUI();

        // 3) 배경 스크롤
        groundScroll = (groundScroll + currentSpeed * dt) % 120;
        volcanoScroll = (volcanoScroll + currentSpeed * 0.08 * dt) % LOGIC_WIDTH;

        // 4) 공룡 점프 및 착지 물리
        if (!dino.isGrounded) {
          if (dino.isHoldingJump) {
            dino.jumpHoldTimer += dt;
            if (dino.jumpHoldTimer >= MAX_JUMP_HOLD_TIME) {
              // 최대 약 0.3초까지만 높이에 반영되고 그 이상 눌러도 최대 높이에서 멈춤
              dino.isHoldingJump = false;
              if (dino.vy < JUMP_RELEASE_CAP) {
                dino.vy = JUMP_RELEASE_CAP;
              }
            } else {
              dino.vy = JUMP_HOLD_VELOCITY;
            }
          } else {
            dino.vy += GRAVITY * dt;
          }

          dino.y += dino.vy * dt;

          if (dino.y >= GROUND_Y) {
            dino.y = GROUND_Y;
            dino.vy = 0;
            dino.isGrounded = true;
            dino.isHoldingJump = false;
            dino.jumpHoldTimer = 0;
            dino.isDucking = isDuckDown;
            spawnDustParticles(dino.x + 20, GROUND_Y, 5);
          }
        } else {
          dino.isDucking = isDuckDown;
          dino.runCycle += dt * (11 * speedMultiplier);
        }

        // 5) 무적 타이머 및 공룡 주변 불꽃 파티클
        if (dino.invincibleTimer > 0) {
          dino.invincibleTimer = Math.max(0, dino.invincibleTimer - dt);
          if (Math.random() < 45 * dt) {
            const w = dino.isDucking ? dino.duckWidth : dino.standWidth;
            const h = dino.isDucking ? dino.duckHeight : dino.standHeight;
            particles.push({
              x: dino.x + Math.random() * w,
              y: dino.y - Math.random() * h,
              vx: -50 - Math.random() * 60,
              vy: -60 - Math.random() * 90,
              life: 0.28 + Math.random() * 0.15,
              maxLife: 0.43,
              size: 4 + Math.random() * 4,
              color: Math.random() < 0.5 ? '#ff5722' : '#ffca28'
            });
          }
        }

        // 6) 장애물 스폰 및 이동
        nextObstacleDistance -= currentSpeed * dt;
        if (nextObstacleDistance <= 0) {
          spawnObstacle();
        }

        const dinoBox = getDinoHitbox();

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];

          if (obs.blasted) {
            // 무적 충돌 후 "펑" 애니메이션과 함께 화면 밖으로 날아감
            obs.x += obs.vx * dt;
            obs.y += obs.vy * dt;
            obs.vy += 1200 * dt;
            obs.rotation += obs.vRot * dt;

            if (obs.x > LOGIC_WIDTH + 160 || obs.y < -200 || obs.y > LOGIC_HEIGHT + 200) {
              obstacles.splice(i, 1);
            }
            continue;
          }

          obs.x -= currentSpeed * dt;
          if (obs.isAirborne) {
            obs.wingPhase += dt * 11;
          }

          // 충돌 검사
          if (isIntersecting(dinoBox, getObstacleHitbox(obs))) {
            if (dino.invincibleTimer > 0) {
              // 무적 상태: "펑" 애니메이션 + 장애물 날려보내기
              obs.blasted = true;
              obs.vx = 680 + currentSpeed * 0.35;
              obs.vy = -520;
              obs.vRot = 13;
              spawnBlastEffect(obs.x + obs.width * 0.5, obs.y - obs.height * 0.5);
            } else {
              // 무적이 아닐 때: 게임 오버
              triggerGameOver();
              return;
            }
          }

          if (obs.x + obs.width < -60) {
            obstacles.splice(i, 1);
          }
        }

        // 7) 불꽃 아이템 스폰 및 획득 판정
        trySpawnFlameItem(dt);

        for (let i = flameItems.length - 1; i >= 0; i--) {
          const item = flameItems[i];
          item.x -= currentSpeed * dt;
          item.pulse += dt * 8;

          const itemBox = {
            left: item.x - item.radius,
            right: item.x + item.radius,
            top: item.y - item.radius,
            bottom: item.y + item.radius
          };

          if (isIntersecting(dinoBox, itemBox)) {
            dino.invincibleTimer = INVINCIBLE_DURATION;
            spawnBlastEffect(item.x, item.y);
            flameItems.splice(i, 1);
            continue;
          }

          if (item.x + item.radius < -40) {
            flameItems.splice(i, 1);
          }
        }

        // 8) "펑!" 팝업 애니메이션 및 파티클 업데이트
        for (let i = popEffects.length - 1; i >= 0; i--) {
          popEffects[i].timer += dt;
          if (popEffects[i].timer >= popEffects[i].duration) {
            popEffects.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      // =========================================================
      // 10. 직접 그린 쥬라기 시대 그래픽 렌더링 (외부 이미지 0개)
      // =========================================================
      function drawBackground() {
        // 1) 쥬라기 하늘
        const skyGrad = ctx.createLinearGradient(0, 0, 0, 155);
        skyGrad.addColorStop(0, '#d98245');
        skyGrad.addColorStop(0.55, '#edb26b');
        skyGrad.addColorStop(1, '#f5d298');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, LOGIC_WIDTH, 155);

        // 2) 태양
        ctx.fillStyle = 'rgba(255, 244, 210, 0.55)';
        ctx.beginPath();
        ctx.arc(760, 56, 32, 0, Math.PI * 2);
        ctx.fill();

        // 3) 구름
        ctx.fillStyle = 'rgba(255, 241, 214, 0.5)';
        for (const c of clouds) {
          const cx = ((c.x - cloudScroll + LOGIC_WIDTH + 160) % (LOGIC_WIDTH + 160)) - 80;
          drawCloud(cx, c.y, c.scale);
        }

        // 4) 원경 화산 두 봉우리 (하늘 쪽 배경)
        drawVolcano(215, 138, 135, 62);
        drawVolcano(668, 138, 110, 50);

        // 화산 연기
        for (const puff of smokePuffs) {
          const driftX = Math.sin(puff.phase) * 6;
          const driftY = (puff.phase % 2) * -8;
          ctx.fillStyle = `rgba(92, 68, 56, ${puff.alpha})`;
          ctx.beginPath();
          ctx.arc(puff.x + driftX, puff.y + driftY, puff.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 5) 원경 언덕 능선 및 초록색 양치식물
        // 장애물이 지나다니는 영역(지면 및 공룡 점프 높이 y >= 145)에는 초록색을 쓰지 않고,
        // 장애물이 닿지 않는 먼 배경(하늘 쪽 능선 y = 112 ~ 138)에만 배치
        ctx.fillStyle = '#8b6343';
        ctx.beginPath();
        ctx.moveTo(0, 142);
        ctx.quadraticCurveTo(180, 122, 390, 136);
        ctx.quadraticCurveTo(640, 118, 900, 138);
        ctx.lineTo(900, 146);
        ctx.lineTo(0, 146);
        ctx.closePath();
        ctx.fill();

        const fernPositions = [52, 112, 315, 365, 480, 535, 795, 855];
        for (const fx of fernPositions) {
          drawDistantFern(fx, 134);
        }

        // 6) 장애물이 지나다니는 영역 (모래 · 황토 · 회갈색 계열, 초록색 0%)
        const playAreaGrad = ctx.createLinearGradient(0, 142, 0, GROUND_Y);
        playAreaGrad.addColorStop(0, '#edd09e');
        playAreaGrad.addColorStop(1, '#dfc08c');
        ctx.fillStyle = playAreaGrad;
        ctx.fillRect(0, 142, LOGIC_WIDTH, GROUND_Y - 142);

        // 먼 모래 언덕 실루엣 (황토/회갈색)
        ctx.fillStyle = '#cfa972';
        ctx.beginPath();
        ctx.moveTo(0, 260);
        for (let x = 0; x <= LOGIC_WIDTH + 120; x += 120) {
          const shiftX = x - (volcanoScroll % 120);
          ctx.quadraticCurveTo(shiftX + 60, 244, shiftX + 120, 260);
        }
        ctx.lineTo(LOGIC_WIDTH, GROUND_Y);
        ctx.lineTo(0, GROUND_Y);
        ctx.closePath();
        ctx.fill();

        // 7) 지면 (황토 & 회갈색 지층)
        ctx.fillStyle = '#9c754c';
        ctx.fillRect(0, GROUND_Y, LOGIC_WIDTH, LOGIC_HEIGHT - GROUND_Y);

        // 지면 경계선
        ctx.fillStyle = '#6b4c2e';
        ctx.fillRect(0, GROUND_Y, LOGIC_WIDTH, 4);

        // 지면 자갈/모래 질감 스크롤
        ctx.fillStyle = '#755333';
        for (let x = -120; x < LOGIC_WIDTH + 120; x += 60) {
          const gx = x - (groundScroll % 60);
          ctx.fillRect(gx + 10, GROUND_Y + 14, 14, 4);
          ctx.fillRect(gx + 36, GROUND_Y + 28, 9, 3);
          ctx.fillStyle = '#b88f63';
          ctx.fillRect(gx + 22, GROUND_Y + 44, 18, 4);
          ctx.fillStyle = '#755333';
        }
      }

      function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.arc(18, -4, 20, 0, Math.PI * 2);
        ctx.arc(38, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawVolcano(centerX, baseY, halfWidth, height) {
        ctx.fillStyle = '#5c3c2e';
        ctx.beginPath();
        ctx.moveTo(centerX - halfWidth, baseY);
        ctx.lineTo(centerX - 18, baseY - height);
        ctx.lineTo(centerX + 18, baseY - height);
        ctx.lineTo(centerX + halfWidth, baseY);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#452b20';
        ctx.beginPath();
        ctx.moveTo(centerX, baseY - height);
        ctx.lineTo(centerX + 18, baseY - height);
        ctx.lineTo(centerX + halfWidth, baseY);
        ctx.lineTo(centerX + 12, baseY);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#e65100';
        ctx.fillRect(centerX - 15, baseY - height, 30, 4);
      }

      function drawDistantFern(x, baseY) {
        ctx.save();
        ctx.translate(x, baseY);
        ctx.strokeStyle = '#3b6e35';
        ctx.lineWidth = 2.2;

        const angles = [-0.85, -0.42, 0, 0.42, 0.85];
        for (const ang of angles) {
          ctx.save();
          ctx.rotate(ang);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(3, -10, 0, -20);
          ctx.stroke();

          ctx.fillStyle = '#4c8544';
          for (let h = -6; h >= -18; h -= 4) {
            ctx.beginPath();
            ctx.ellipse(-3, h, 3, 1.4, -0.3, 0, Math.PI * 2);
            ctx.ellipse(3, h, 3, 1.4, 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
        ctx.restore();
      }

      function drawDinosaur() {
        ctx.save();
        const isInvincible = dino.invincibleTimer > 0;

        // 무적 상태일 때 공룡 주변 불꽃 후광 효과
        if (isInvincible) {
          const w = dino.isDucking ? dino.duckWidth : dino.standWidth;
          const h = dino.isDucking ? dino.duckHeight : dino.standHeight;
          const cx = dino.x + w * 0.5;
          const cy = dino.y - h * 0.5;
          const flicker = Math.sin(performance.now() * 0.03) * 4;

          const auraGrad = ctx.createRadialGradient(cx, cy, 6, cx, cy, 44 + flicker);
          auraGrad.addColorStop(0, 'rgba(255, 238, 88, 0.85)');
          auraGrad.addColorStop(0.55, 'rgba(255, 87, 34, 0.55)');
          auraGrad.addColorStop(1, 'rgba(255, 87, 34, 0)');
          ctx.fillStyle = auraGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, 44 + flicker, 0, Math.PI * 2);
          ctx.fill();
        }

        const bodyColor = isInvincible ? '#4a1c11' : '#2c3540';
        const bellyColor = isInvincible ? '#ff8a65' : '#63707f';
        const crestColor = isInvincible ? '#ffca28' : '#b84a27';

        if (dino.isDucking) {
          const topY = dino.y - dino.duckHeight;

          ctx.fillStyle = bodyColor;
          ctx.beginPath();
          ctx.moveTo(dino.x + 14, topY + 10);
          ctx.lineTo(dino.x - 10, topY + 6);
          ctx.lineTo(dino.x + 14, topY + 22);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = bodyColor;
          ctx.beginPath();
          ctx.roundRect(dino.x + 8, topY + 4, 48, 20, 8);
          ctx.fill();

          ctx.fillStyle = crestColor;
          ctx.fillRect(dino.x + 14, topY + 1, 6, 4);
          ctx.fillRect(dino.x + 24, topY + 1, 6, 4);
          ctx.fillRect(dino.x + 34, topY + 1, 6, 4);

          ctx.fillStyle = '#fff8e7';
          ctx.fillRect(dino.x + 44, topY + 8, 5, 5);
          ctx.fillStyle = '#111';
          ctx.fillRect(dino.x + 46, topY + 9, 2.5, 2.5);

          const legOffset = Math.sin(dino.runCycle) * 5;
          ctx.fillStyle = bodyColor;
          ctx.fillRect(dino.x + 18 + legOffset, topY + 22, 7, 10);
          ctx.fillRect(dino.x + 34 - legOffset, topY + 22, 7, 10);
        } else {
          const topY = dino.y - dino.standHeight;

          ctx.fillStyle = bodyColor;
          ctx.beginPath();
          ctx.moveTo(dino.x + 14, topY + 24);
          ctx.lineTo(dino.x - 6, topY + 18);
          ctx.lineTo(dino.x + 14, topY + 38);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = bodyColor;
          ctx.beginPath();
          ctx.roundRect(dino.x + 10, topY + 18, 24, 26, 8);
          ctx.fill();

          ctx.fillStyle = bellyColor;
          ctx.beginPath();
          ctx.roundRect(dino.x + 22, topY + 22, 10, 18, 5);
          ctx.fill();

          ctx.fillStyle = bodyColor;
          ctx.beginPath();
          ctx.roundRect(dino.x + 18, topY, 28, 22, 7);
          ctx.fill();

          ctx.fillStyle = '#1b2229';
          ctx.fillRect(dino.x + 31, topY + 14, 15, 2.5);

          ctx.fillStyle = crestColor;
          ctx.beginPath();
          ctx.moveTo(dino.x + 12, topY + 14);
          ctx.lineTo(dino.x + 17, topY + 8);
          ctx.lineTo(dino.x + 19, topY + 16);
          ctx.fill();

          ctx.fillStyle = gameState === 'GAME_OVER' ? '#ff5252' : '#fff8e7';
          ctx.fillRect(dino.x + 32, topY + 5, 5.5, 5.5);
          ctx.fillStyle = '#111';
          ctx.fillRect(dino.x + 34.5, topY + 6.5, 2.5, 2.5);

          ctx.fillStyle = bodyColor;
          ctx.fillRect(dino.x + 33, topY + 26, 8, 4);
          ctx.fillRect(dino.x + 39, topY + 26, 3, 6);

          const leftLegY = dino.isGrounded ? Math.max(0, Math.sin(dino.runCycle) * 6) : 3;
          const rightLegY = dino.isGrounded ? Math.max(0, -Math.sin(dino.runCycle) * 6) : 0;

          ctx.fillStyle = bodyColor;
          ctx.fillRect(dino.x + 14, topY + 42 - leftLegY, 7, 14);
          ctx.fillRect(dino.x + 25, topY + 42 - rightLegY, 7, 14);
        }

        ctx.restore();
      }

      function drawObstacles() {
        for (const obs of obstacles) {
          ctx.save();
          if (obs.blasted) {
            const cx = obs.x + obs.width * 0.5;
            const cy = obs.y - obs.height * 0.5;
            ctx.translate(cx, cy);
            ctx.rotate(obs.rotation);
            ctx.translate(-cx, -cy);
          }

          if (obs.kind === 'small_rock') {
            drawRockShape(obs.x, obs.y, obs.width, obs.height, '#2a2d34', '#494e59');
          } else if (obs.kind === 'large_rock') {
            drawRockShape(obs.x, obs.y, obs.width * 0.68, obs.height, '#202228', '#3e424d');
            drawRockShape(obs.x + obs.width * 0.38, obs.y, obs.width * 0.62, obs.height * 0.72, '#2d3038', '#525766');
          } else if (obs.kind === 'small_cactus') {
            drawCactusShape(obs.x, obs.y, obs.width, obs.height, '#b83b14', '#e05a2b');
          } else if (obs.kind === 'large_cactus') {
            drawCactusShape(obs.x, obs.y, obs.width * 0.58, obs.height, '#5e210d', '#9e3816');
            drawCactusShape(obs.x + obs.width * 0.46, obs.y, obs.width * 0.54, obs.height * 0.82, '#7d2b10', '#c4451b');
          } else if (obs.kind === 'pteranodon') {
            drawPteranodon(obs);
          }

          ctx.restore();
        }
      }

      function drawRockShape(x, bottomY, w, h, mainColor, highlightColor) {
        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.moveTo(x + 2, bottomY);
        ctx.lineTo(x + w * 0.16, bottomY - h * 0.72);
        ctx.lineTo(x + w * 0.48, bottomY - h);
        ctx.lineTo(x + w * 0.84, bottomY - h * 0.68);
        ctx.lineTo(x + w - 2, bottomY);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = highlightColor;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.16, bottomY - h * 0.72);
        ctx.lineTo(x + w * 0.48, bottomY - h);
        ctx.lineTo(x + w * 0.44, bottomY - h * 0.35);
        ctx.lineTo(x + w * 0.12, bottomY - h * 0.25);
        ctx.closePath();
        ctx.fill();
      }

      function drawCactusShape(x, bottomY, w, h, mainColor, lightColor) {
        const stemW = Math.max(10, w * 0.42);
        const stemX = x + (w - stemW) * 0.5;

        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.roundRect(stemX, bottomY - h, stemW, h, [stemW * 0.5, stemW * 0.5, 2, 2]);
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(x, bottomY - h * 0.66, stemX - x + 3, 7, 3);
        ctx.roundRect(x, bottomY - h * 0.82, 7, h * 0.22, 3);
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(stemX + stemW - 3, bottomY - h * 0.54, x + w - (stemX + stemW) + 3, 7, 3);
        ctx.roundRect(x + w - 7, bottomY - h * 0.74, 7, h * 0.26, 3);
        ctx.fill();

        ctx.fillStyle = lightColor;
        ctx.fillRect(stemX + 3, bottomY - h + 6, 3, h - 10);

        ctx.fillStyle = '#f7e6ce';
        for (let sy = bottomY - h + 8; sy < bottomY - 6; sy += 10) {
          ctx.fillRect(stemX - 2, sy, 2, 2);
          ctx.fillRect(stemX + stemW, sy + 4, 2, 2);
        }
      }

      function drawPteranodon(obs) {
        const topY = obs.y - obs.height;
        const flap = Math.sin(obs.wingPhase) * 11;

        ctx.fillStyle = '#4a1919';
        ctx.beginPath();
        ctx.ellipse(obs.x + 28, topY + 13, 16, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#b83b14';
        ctx.beginPath();
        ctx.moveTo(obs.x + 14, topY + 11);
        ctx.lineTo(obs.x, topY + 15);
        ctx.lineTo(obs.x + 15, topY + 17);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(obs.x + 18, topY + 8);
        ctx.lineTo(obs.x + 28, topY + 1);
        ctx.lineTo(obs.x + 24, topY + 10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#6e2626';
        ctx.beginPath();
        ctx.moveTo(obs.x + 22, topY + 11);
        ctx.lineTo(obs.x + 34, topY + 11 - flap);
        ctx.lineTo(obs.x + 46, topY + 13);
        ctx.closePath();
        ctx.fill();
      }

      function drawFlameItems() {
        for (const item of flameItems) {
          const pulseScale = 1 + Math.sin(item.pulse) * 0.12;
          ctx.save();
          ctx.translate(item.x, item.y);
          ctx.scale(pulseScale, pulseScale);

          const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
          glow.addColorStop(0, 'rgba(255, 238, 88, 0.9)');
          glow.addColorStop(0.6, 'rgba(255, 87, 34, 0.5)');
          glow.addColorStop(1, 'rgba(255, 87, 34, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 26, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ff3d00';
          ctx.beginPath();
          ctx.moveTo(0, -18);
          ctx.bezierCurveTo(13, -6, 13, 12, 0, 15);
          ctx.bezierCurveTo(-13, 12, -13, -6, 0, -18);
          ctx.fill();

          ctx.fillStyle = '#ff9100';
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.bezierCurveTo(8, -3, 8, 9, 0, 12);
          ctx.bezierCurveTo(-8, 9, -8, -3, 0, -12);
          ctx.fill();

          ctx.fillStyle = '#fff59d';
          ctx.beginPath();
          ctx.arc(0, 3, 4.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      function drawEffectsAndParticles() {
        for (const p of particles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const eff of popEffects) {
          const progress = eff.timer / eff.duration;
          const scale = 0.5 + Math.sin(Math.min(1, progress * 1.4) * Math.PI * 0.5) * 0.85;
          const alpha = Math.max(0, 1 - Math.pow(progress, 1.8));

          ctx.save();
          ctx.translate(eff.x, eff.y - progress * 24);
          ctx.scale(scale, scale);
          ctx.globalAlpha = alpha;

          const spikes = 10;
          const outerR = 36;
          const innerR = 19;
          ctx.fillStyle = '#ffca28';
          ctx.strokeStyle = '#d84315';
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let i = 0; i < spikes * 2; i++) {
            const r = i % 2 === 0 ? outerR : innerR;
            const ang = (Math.PI * i) / spikes;
            const px = Math.cos(ang) * r;
            const py = Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.font = '900 22px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#3e1404';
          ctx.fillText('펑!', 0, 2);

          ctx.restore();
        }

        if (dino.invincibleTimer > 0 && gameState === 'PLAYING') {
          const ratio = dino.invincibleTimer / INVINCIBLE_DURATION;
          const barW = 190;
          const barH = 12;
          const bx = (LOGIC_WIDTH - barW) * 0.5;
          const by = 16;

          ctx.save();
          ctx.fillStyle = 'rgba(40, 20, 10, 0.78)';
          ctx.beginPath();
          ctx.roundRect(bx - 10, by - 6, barW + 20, 34, 8);
          ctx.fill();

          ctx.fillStyle = '#ffd54f';
          ctx.font = '800 12px "Malgun Gothic", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`불꽃 무적 (${dino.invincibleTimer.toFixed(1)}초)`, LOGIC_WIDTH * 0.5, by + 6);

          ctx.fillStyle = '#4e2a18';
          ctx.fillRect(bx, by + 12, barW, barH - 4);

          ctx.fillStyle = '#ff6d00';
          ctx.fillRect(bx, by + 12, barW * ratio, barH - 4);
          ctx.restore();
        }
      }

      // =========================================================
      // 11. 메인 애니메이션 루프
      // =========================================================
      let lastTimestamp = performance.now();

      function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
        lastTimestamp = timestamp;

        update(dt);

        ctx.clearRect(0, 0, LOGIC_WIDTH, LOGIC_HEIGHT);
        drawBackground();
        drawFlameItems();
        drawObstacles();
        drawDinosaur();
        drawEffectsAndParticles();

        requestAnimationFrame(gameLoop);
      }

      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
